name: Build - Apk

on:
  push:
    branches:
      - maiin
  pull_request:
    branches:
      - maiin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.32.5
      - name: Install dependencies
        run: flutter pub get
        working-directory: qr_code_preview
      - name: Build APK
        run: flutter build apk --split-per-abi
        working-directory: qr_code_preview
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: qr_code_preview/build/app/outputs/flutter-apk/*.apk
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}



